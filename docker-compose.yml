version: '3.8'

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mental_health
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  api:
    build: ./backend
    ports:
      - "5000:5000"

  web:
    build: ./frontend
    ports:
      - "3000:3000"
