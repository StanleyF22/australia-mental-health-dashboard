<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Australia Mental Health Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#003366;
    color:white;
    padding:25px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.crisis-banner{
    background:#c62828;
    color:white;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.card h3{
    color:#666;
    margin-bottom:10px;
}

.number{
    font-size:2rem;
    font-weight:bold;
    color:#003366;
}

.section{
    margin-top:30px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
}

th
