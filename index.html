<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard Test</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
    font-family:Arial;
    margin:40px;
}
.card{
    background:#f5f5f5;
    padding:20px;
    border-radius:10px;
    max-width:800px;
}
</style>
</head>
<body>

<div class="card">
    <h1>Australia Dashboard Test</h1>
    <canvas id="myChart"></canvas>
</div>

<script>

window.onload = function(){

const ctx =
document.getElementById('myChart');

new Chart(ctx,{
    type:'bar',
    data:{
        labels:[
            'QLD',
            'NSW',
            'VIC',
            'WA'
        ],
        datasets:[{
            label:'Sample Data',
            data:[12,19,8,14],
            backgroundColor:[
                'blue',
                'green',
                'orange',
                'red'
            ]
        }]
    }
});

};

</script>

</body>
</html>
